name: Probe careers pages
# Opens careers pages in a screenless browser and lists the job systems they use.
# Run by hand from the Actions tab; results are attached to the run as "probe-results".
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Company ids, comma-separated (empty = all)"
        required: false
        default: ""
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - run: |
          ARGS="--urls data/probe_extra.json --shard ${{ matrix.shard }}/6"
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          timeout 15m python -m robot.probe $ARGS || true
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.shard }}
          path: data/probe-*.json
