name: Discover careers sites

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "missing (companies without a source) or all"
        required: true
        default: "missing"
      only:
        description: "Optional: company ids, comma-separated"
        required: false
        default: ""
  schedule:
    - cron: "30 3 1 * *"  # first day of each month, re-check everything
  push:
    branches: [main]
    paths: ["data/companies.csv", "data/seeds.json", "data/overrides.json"]

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Find each company's hiring system
        run: |
          ARGS=""
          SCOPE="${{ github.event_name == 'schedule' && 'all' || inputs.scope || 'missing' }}"
          if [ "$SCOPE" = "all" ]; then ARGS="--all"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          python -m robot.discover $ARGS
          cat data/discovery_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save results
        if: always()
        run: |
          git config user.name "project-reset-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Discovery $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
