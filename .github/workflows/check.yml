name: Check for new roles

on:
  schedule:
    # Times are UTC. Every 15 minutes on weekdays 07:00-19:45, hourly otherwise.
    - cron: "*/15 7-19 * * 1-5"
    - cron: "0 0-6,20-23 * * 1-5"
    - cron: "0 * * * 0,6"
  workflow_run:
    workflows: ["Discover careers sites"]
    types: [completed]
  workflow_dispatch:
    inputs:
      only:
        description: "Company ids to check, comma-separated (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reuse the screenless browser between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}
      - name: Install the screenless browser
        run: python -m playwright install --with-deps chromium
      - name: Read every careers site
        env:
          ONLY: ${{ inputs.only }}
        run: timeout 15m python -m robot.run
      - name: Build the website's list of roles
        if: always()
        run: python -m robot.export_site
      - name: Send roles to the website's database
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m robot.push_supabase
      - name: Save results
        if: always()
        run: |
          git config user.name "project-reset-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site web/public/openings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update openings $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
      - name: Email the owner if a source broke
        if: hashFiles('data/alert.txt') != ''
        run: |
          cat data/alert.txt
          exit 1
